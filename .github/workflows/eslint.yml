name: Node.js CI (ESLint)

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Node.js (26.x)
        uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          cache: "npm"
      - name: Check code with ESLint
        run: npm run lint:check
          